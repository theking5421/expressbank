<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Express Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050505;
      --bg-glass: rgba(20, 20, 24, 0.65);
      --gold: #cba052;
      --gold-gradient: linear-gradient(135deg, #d4b26a 0%, #cba052 50%, #99742c 100%);
      --text-main: #f8fafc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Ambient Orbs */
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.4; }
    .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(203, 160, 82, 0.3) 0%, transparent 70%); top: -10%; left: -10%; animation: float1 15s ease-in-out infinite alternate; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(30, 58, 138, 0.2) 0%, transparent 70%); bottom: -20%; right: -10%; animation: float2 20s ease-in-out infinite alternate; }

    @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 50px) scale(1.1); } }
    @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-100px, -50px) scale(1.2); } }

    .login-wrapper { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 24px; }
    .login-card {
      background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden;
    }
    
    .brand-logo { text-align: center; margin-bottom: 32px; font-size: 24px; font-weight: 800; letter-spacing: 1px; }
    .brand-logo span { color: var(--gold); }
    .header h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .header p { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; text-align: center; line-height: 1.5; }

    /* Form Inputs */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
    
    .form-control {
      width: 100%; height: 52px; padding: 0 16px; 
      background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text-main); font-size: 15px; outline: none; transition: all 0.3s ease;
    }
    .form-control:focus { border-color: var(--gold); background: rgba(0, 0, 0, 0.6); box-shadow: 0 0 0 3px rgba(203, 160, 82, 0.1); }

    /* Links & Buttons */
    .forgot-row { display: flex; justify-content: flex-end; margin-bottom: 24px; }
    .forgot-row a { color: var(--gold); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; cursor: pointer; }
    .forgot-row a:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%; height: 56px; background: var(--gold-gradient); color: #000;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.3s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(203, 160, 82, 0.2); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .btn-secondary {
      width: 100%; height: 52px; background: transparent; color: var(--text-main);
      border: 1px solid var(--border); border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.3s ease; margin-top: 16px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    /* Error & Success Messages */
    .error-msg, .success-msg {
      font-size: 13px; text-align: center; margin-top: 16px;
      display: none; padding: 12px; border-radius: 8px; line-height: 1.4;
    }
    .error-msg { color: #f85149; background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.2); }
    .success-msg { color: #2ea043; background: rgba(46, 160, 67, 0.1); border: 1px solid rgba(46, 160, 67, 0.2); }

    .login-footer { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-muted); }
    .login-footer a { color: var(--text-main); text-decoration: none; font-weight: 600; transition: 0.2s; cursor: pointer; }
    .login-footer a:hover { color: var(--gold); }
    .back-link { display: inline-block; margin-top: 16px; font-size: 13px !important; color: var(--text-muted) !important; font-weight: 400 !important; }
    .back-link:hover { color: var(--text-main) !important; }

    @media (max-width: 480px) { .login-card { padding: 40px 24px; } }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <div class="brand-logo">⚡ EXPRESS <span>BANK</span></div>

      <!-- LOGIN VIEW -->
      <div id="loginView">
        <div class="header">
          <h2>Welcome back</h2>
          <p>Sign in to your account to continue.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="forgot-row">
            <a id="showForgotBtn">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
          <div id="loginError" class="error-msg"></div>
        </form>

        <div class="login-footer">
          Don't have an account? <a href="signup.html">Create one</a>
          <br>
          <a href="index.html" class="back-link">← Back to website</a>
        </div>
      </div>

      <!-- FORGOT PASSWORD VIEW -->
      <div id="forgotView" style="display: none;">
        <div class="header">
          <h2>Reset Password</h2>
          <p>Enter your email and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgotForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="resetEmail" class="form-control" placeholder="you@example.com" required>
          </div>

          <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
          <button type="button" class="btn-secondary" id="backToLoginBtn">Back to Login</button>
          
          <div id="resetError" class="error-msg"></div>
          <div id="resetSuccess" class="success-msg"></div>
        </form>
      </div>

    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD76E6QHruNuqLL_MInuzI9VyKFey1zvLw",
      authDomain: "express-uts.firebaseapp.com",
      projectId: "express-uts",
      storageBucket: "express-uts.firebasestorage.app",
      messagingSenderId: "812145406981",
      appId: "1:812145406981:web:84797ac9d423b858dbd86c"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // UI Elements
    const loginView = document.getElementById("loginView");
    const forgotView = document.getElementById("forgotView");
    const showForgotBtn = document.getElementById("showForgotBtn");
    const backToLoginBtn = document.getElementById("backToLoginBtn");

    // Toggle Views
    showForgotBtn.addEventListener("click", (e) => {
      e.preventDefault();
      loginView.style.display = "none";
      forgotView.style.display = "block";
    });

    backToLoginBtn.addEventListener("click", () => {
      forgotView.style.display = "none";
      loginView.style.display = "block";
      document.getElementById("resetSuccess").style.display = "none";
      document.getElementById("resetError").style.display = "none";
    });

    // --- LOGIN LOGIC ---
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;
      
      loginError.style.display = "none";
      loginBtn.textContent = "Signing in...";
      loginBtn.disabled = true;

      try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        const user = cred.user;
        const userDoc = await db.collection("users").doc(user.uid).get();
        
        if (userDoc.exists) {
          const userData = userDoc.data();
          if (userData.status === "Blocked") {
            await auth.signOut();
            throw new Error("Your account has been blocked. Please contact support.");
          }
          localStorage.setItem("currentUser", user.email);
          localStorage.setItem("currentName", userData.fullName);
          localStorage.setItem("currentUID", user.uid);

          if (user.email === "arinzenneji00@gmail.com") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "dashboard.html";
          }
        } else {
          throw new Error("User data not found in database.");
        }
      } catch (error) {
        loginError.textContent = error.message;
        loginError.style.display = "block";
        loginBtn.textContent = "Sign In";
        loginBtn.disabled = false;
      }
    });

    // --- FORGOT PASSWORD LOGIC ---
    const forgotForm = document.getElementById("forgotForm");
    const resetBtn = document.getElementById("resetBtn");
    const resetError = document.getElementById("resetError");
    const resetSuccess = document.getElementById("resetSuccess");

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("resetEmail").value.trim();

      resetError.style.display = "none";
      resetSuccess.style.display = "none";
      resetBtn.textContent = "Sending...";
      resetBtn.disabled = true;

      try {
        await auth.sendPasswordResetEmail(email);
        resetSuccess.textContent = "Success! Check your email for the reset link.";
        resetSuccess.style.display = "block";
        resetBtn.textContent = "Send Reset Link";
        resetBtn.disabled = false;
      } catch (error) {
        resetError.textContent = error.message;
        resetError.style.display = "block";
        resetBtn.textContent = "Send Reset Link";
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
