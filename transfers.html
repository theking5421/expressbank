<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express Bank — Transfers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #050505; --bg-glass: rgba(20, 20, 24, 0.6); --gold: #cba052; --text-main: #f8fafc; --text-muted: #8b949e; --border: rgba(255, 255, 255, 0.08); --font-main: 'Inter', sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-dark); background-image: radial-gradient(circle at top right, rgba(203, 160, 82, 0.05) 0%, transparent 40%); color: var(--text-main); font-family: var(--font-main); -webkit-font-smoothing: antialiased; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    
    /* Top Nav */
    .top-navbar { position: sticky; top: 0; z-index: 900; display: flex; align-items: center; height: 72px; padding: 0 24px; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .back-btn { color: var(--text-muted); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; transition: 0.2s; }
    .back-btn:hover { color: var(--gold); }
    
    /* Main Content */
    .main-content { padding: 40px 24px; max-width: 800px; margin: 0 auto; }
    .page-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .page-subtitle { color: var(--text-muted); margin-bottom: 32px; }
    
    /* Transfer Grid */
    .transfer-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .transfer-card { background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 20px; transition: 0.3s; cursor: pointer; }
    .transfer-card:hover { border-color: var(--gold); background: rgba(203, 160, 82, 0.05); transform: translateY(-2px); }
    .icon-box { width: 56px; height: 56px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--gold); flex-shrink: 0; }
    .transfer-info h3 { font-size: 18px; margin-bottom: 4px; }
    .transfer-info p { color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>
  <header class="top-navbar">
    <a href="dashboard.html" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to Dashboard
    </a>
  </header>

  <main class="main-content">
    <h1 class="page-title">Send Money</h1>
    <p class="page-subtitle">Choose where you want to transfer your funds.</p>

    <div class="transfer-grid">
      <a href="transfer-express.html" class="transfer-card">
        <div class="icon-box">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
        </div>
        <div class="transfer-info">
          <h3>Transfer to Express</h3>
          <p>Instant transfer to another Express Bank user.</p>
        </div>
      </a>

      <a href="transfer-other.html" class="transfer-card">
        <div class="icon-box">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
        </div>
        <div class="transfer-info">
          <h3>Other Banks</h3>
          <p>Send money to external local bank accounts.</p>
        </div>
      </a>

      <a href="transfer-international.html" class="transfer-card">
        <div class="icon-box">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="transfer-info">
          <h3>International</h3>
          <p>Send money globally to over 180 countries.</p>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
