<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Express Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #050505;
      --bg-glass: rgba(20, 20, 24, 0.65);
      --gold: #cba052;
      --gold-gradient: linear-gradient(135deg, #d4b26a 0%, #cba052 50%, #99742c 100%);
      --text-main: #f8fafc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Ambient Orbs */
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.4; }
    .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(203, 160, 82, 0.3) 0%, transparent 70%); top: -10%; right: -10%; animation: float1 15s ease-in-out infinite alternate; }
    .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(30, 58, 138, 0.2) 0%, transparent 70%); bottom: -20%; left: -10%; animation: float2 20s ease-in-out infinite alternate; }

    @keyframes float1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-100px, 50px) scale(1.1); } }
    @keyframes float2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, -50px) scale(1.2); } }

    /* Wrapper & Card */
    .login-wrapper { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 24px; }
    .login-card {
      background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: -50%; right: -50%; width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(203, 160, 82, 0.1) 0%, transparent 60%); pointer-events: none;
    }

    /* Typography */
    .brand-logo { text-align: center; margin-bottom: 32px; font-size: 24px; font-weight: 800; letter-spacing: 1px; }
    .brand-logo span { color: var(--gold); }
    .header h2 { font-size: 24px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .header p { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; text-align: center; line-height: 1.5; }

    /* Form Inputs */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; }
    
    .form-control {
      width: 100%; height: 52px; padding: 0 16px; 
      background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text-main); font-size: 15px; outline: none; transition: all 0.3s ease;
    }
    .form-control:focus { border-color: var(--gold); background: rgba(0, 0, 0, 0.6); box-shadow: 0 0 0 3px rgba(203, 160, 82, 0.1); }

    /* Button */
    .btn-primary {
      width: 100%; height: 56px; background: var(--gold-gradient); color: #000;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: all 0.3s ease; margin-top: 12px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(203, 160, 82, 0.2); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    /* Error Message */
    .error-msg {
      color: #f85149; font-size: 13px; text-align: center; margin-top: 16px;
      display: none; background: rgba(248, 81, 73, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(248, 81, 73, 0.2);
      line-height: 1.4;
    }

    /* Footer Links */
    .login-footer { text-align: center; margin-top: 32px; font-size: 14px; color: var(--text-muted); }
    .login-footer a { color: var(--text-main); text-decoration: none; font-weight: 600; transition: 0.2s; }
    .login-footer a:hover { color: var(--gold); }
    .back-link { display: inline-block; margin-top: 16px; font-size: 13px !important; color: var(--text-muted) !important; font-weight: 400 !important; }
    .back-link:hover { color: var(--text-main) !important; }

    @media (max-width: 480px) {
      .login-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <div class="brand-logo">⚡ EXPRESS <span>BANK</span></div>

      <div class="header">
        <h2>Create an Account</h2>
        <p>Join Express Bank today.</p>
      </div>

      <form id="signupForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" class="form-control" placeholder="Min 6 characters" required>
        </div>
        
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-type password" required>
        </div>

        <button type="submit" class="btn-primary" id="signupBtn">Sign Up</button>
        <div id="errorText" class="error-msg"></div>
      </form>

      <div class="login-footer">
        Already have an account? <a href="login.html">Sign in</a>
        <br>
        <a href="index.html" class="back-link">← Back to website</a>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD76E6QHruNuqLL_MInuzI9VyKFey1zvLw",
      authDomain: "express-uts.firebaseapp.com",
      projectId: "express-uts",
      storageBucket: "express-uts.firebasestorage.app",
      messagingSenderId: "812145406981",
      appId: "1:812145406981:web:84797ac9d423b858dbd86c",
      measurementId: "G-8EH3H5NF18"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const signupForm = document.getElementById("signupForm");
    const signupBtn = document.getElementById("signupBtn");
    const errorText = document.getElementById("errorText");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const name = document.getElementById("fullName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const pass = document.getElementById("signupPassword").value;
      const confirmPass = document.getElementById("confirmPassword").value;
      
      errorText.style.display = "none";

      if (pass !== confirmPass) {
        errorText.textContent = "Passwords do not match.";
        errorText.style.display = "block";
        return;
      }

      signupBtn.textContent = "Creating account...";
      signupBtn.disabled = true;

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        
        await db.collection("users").doc(cred.user.uid).set({
          fullName: name,
          email: email,
          balance: 2500.00,
          accountNumber: "•••• " + Math.floor(1000 + Math.random() * 9000),
          status: "Active"
        });

        localStorage.setItem("currentUser", email);
        localStorage.setItem("currentName", name);
        localStorage.setItem("currentUID", cred.user.uid);
        
        window.location.href = "dashboard.html";

      } catch (error) {
        errorText.textContent = error.message;
        errorText.style.display = "block";
        signupBtn.textContent = "Sign Up";
        signupBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
