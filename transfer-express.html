<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfer to Express — Express Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #050505; --bg-glass: rgba(20, 20, 24, 0.6); --gold: #cba052; --text-main: #f8fafc; --text-muted: #8b949e; --border: rgba(255, 255, 255, 0.08); }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); background-image: radial-gradient(circle at top right, rgba(203, 160, 82, 0.05) 0%, transparent 40%); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    a { text-decoration: none; color: inherit; }
    .transfer-container { width: 100%; max-width: 480px; background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid rgba(203, 160, 82, 0.3); border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; transition: 0.2s; }
    .back-btn:hover { color: var(--gold); }
    .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .header p { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .form-control { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: white; font-family: inherit; font-size: 15px; outline: none; transition: 0.2s; }
    .form-control:focus { border-color: var(--gold); }
    .input-with-icon { position: relative; }
    .input-with-icon span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-weight: 600; font-size: 16px; }
    .input-with-icon input { padding-left: 36px; font-size: 18px; font-weight: 700; }
    .btn-submit { width: 100%; background: var(--gold); color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .secure-notice { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 20px; }
    .error-msg { color: #f85149; font-size: 13px; text-align: center; margin-top: 16px; display: none; background: rgba(248, 81, 73, 0.1); padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="transfer-container">
    <a href="transfers.html" class="back-btn">← Back to Transfers</a>
    
    <div class="header">
      <h1>Transfer to Express</h1>
      <p>Send money instantly to another Express Bank user.</p>
    </div>

    <form id="transferForm">
      <div class="form-group">
        <label>Recipient Email</label>
        <input type="email" id="recipientEmail" class="form-control" placeholder="e.g. john@example.com" required>
      </div>

      <div class="form-group">
        <label>Amount (USD)</label>
        <div class="input-with-icon">
          <span>$</span>
          <input type="number" id="transferAmount" class="form-control" placeholder="0.00" min="1" step="0.01" required>
        </div>
      </div>

      <div class="form-group">
        <label>Memo (Optional)</label>
        <input type="text" id="transferMemo" class="form-control" placeholder="What is this for?">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send Instantly</button>
      <div id="errorText" class="error-msg"></div>
      <div class="secure-notice">🔒 Zero transfer fees between Express users.</div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD76E6QHruNuqLL_MInuzI9VyKFey1zvLw",
      authDomain: "express-uts.firebaseapp.com",
      projectId: "express-uts",
      storageBucket: "express-uts.firebasestorage.app",
      messagingSenderId: "812145406981",
      appId: "1:812145406981:web:84797ac9d423b858dbd86c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userEmail = localStorage.getItem("currentUser");
    const userUID = localStorage.getItem("currentUID");

    if (!userUID) {
      alert("You must be logged in to view this page.");
      window.location.href = "login.html";
    }

    document.getElementById("transferForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("errorText");
      const recipientEmail = document.getElementById("recipientEmail").value.trim().toLowerCase();
      const amount = parseFloat(document.getElementById("transferAmount").value);
      const memo = document.getElementById("transferMemo").value.trim() || "Transfer";

      errorBox.style.display = "none";
      btn.textContent = "Processing...";
      btn.disabled = true;

      // Security Validations
      if (recipientEmail === userEmail.toLowerCase()) {
        errorBox.textContent = "You cannot send money to yourself.";
        errorBox.style.display = "block";
        btn.textContent = "Send Instantly"; btn.disabled = false;
        return;
      }
      if (amount <= 0 || isNaN(amount)) {
        errorBox.textContent = "Please enter a valid amount greater than 0.";
        errorBox.style.display = "block";
        btn.textContent = "Send Instantly"; btn.disabled = false;
        return;
      }

      try {
        const usersRef = db.collection("users");
        const query = usersRef.where("email", "==", recipientEmail);
        const querySnapshot = await query.get();

        if (querySnapshot.empty) {
          throw new Error("Recipient not found. Please check the email.");
        }

        const recipientDoc = querySnapshot.docs[0];
        const recipientUID = recipientDoc.id;

        await db.runTransaction(async (transaction) => {
          const senderRef = db.collection("users").doc(userUID);
          const receiverRef = db.collection("users").doc(recipientUID);

          const senderDoc = await transaction.get(senderRef);
          if (!senderDoc.exists()) throw new Error("Sender account not found.");

          const senderBalance = Number(senderDoc.data().balance || 0);
          if (senderBalance < amount) {
            throw new Error("Insufficient funds. Your balance is $" + senderBalance.toFixed(2));
          }

          // Deduct from sender
          transaction.update(senderRef, { balance: senderBalance - amount });
          
          // Add to receiver
          const receiverBalance = Number(recipientDoc.data().balance || 0);
          transaction.update(receiverRef, { balance: receiverBalance + amount });

          // 1. LOG SENDER TRANSACTION (Debit)
          const senderTxRef = db.collection("transactions").doc();
          transaction.set(senderTxRef, {
            senderEmail: userEmail,
            recipientEmail: recipientEmail,
            amount: amount,
            memo: memo,
            type: "Debit",
            date: new Date().toLocaleString(),
            status: "Completed"
          });

          // 2. LOG RECEIVER TRANSACTION (Credit)
          const receiverTxRef = db.collection("transactions").doc();
          transaction.set(receiverTxRef, {
            senderEmail: userEmail,
            recipientEmail: recipientEmail,
            amount: amount,
            memo: memo,
            type: "Credit",
            date: new Date().toLocaleString(),
            status: "Completed"
          });
        });

        alert(`Success! $${amount.toFixed(2)} sent to ${recipientEmail}`);
        window.location.href = "dashboard.html";

      } catch (error) {
        errorBox.textContent = error.message;
        errorBox.style.display = "block";
        btn.textContent = "Send Instantly";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
